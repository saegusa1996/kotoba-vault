<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Kotoba Vault workflow</title>
  <desc id="desc">A Japanese vocabulary note moves from an inbox through reading metadata into a gojuon folder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#171923"/>
      <stop offset="1" stop-color="#202334"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#9fe3bd"/>
    </marker>
  </defs>
  <rect width="960" height="260" rx="22" fill="url(#bg)"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
    <rect x="45" y="55" width="230" height="150" rx="18" fill="#262a3b" stroke="#b8c0d9" stroke-width="2"/>
    <text x="160" y="91" fill="#dce3f5" font-size="21" font-weight="700">Vocabulary inbox</text>
    <text x="160" y="130" fill="#ffffff" font-size="28">温める.md</text>
    <text x="160" y="166" fill="#aab4ce" font-size="17">new or imported note</text>

    <rect x="365" y="55" width="230" height="150" rx="18" fill="#262a3b" stroke="#9fe3bd" stroke-width="2"/>
    <text x="480" y="91" fill="#c9f4dc" font-size="21" font-weight="700">Reading metadata</text>
    <text x="480" y="132" fill="#ffffff" font-size="23">reading: あたためる</text>
    <text x="480" y="166" fill="#aab4ce" font-size="17">deterministic source of truth</text>

    <rect x="685" y="55" width="230" height="150" rx="18" fill="#262a3b" stroke="#f2cf7a" stroke-width="2"/>
    <text x="800" y="91" fill="#ffe3a1" font-size="21" font-weight="700">Gojuon folder</text>
    <text x="800" y="132" fill="#ffffff" font-size="25">Words/あ/温める.md</text>
    <text x="800" y="166" fill="#aab4ce" font-size="17">links updated by Obsidian</text>

    <line x1="285" y1="130" x2="350" y2="130" stroke="#9fe3bd" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="605" y1="130" x2="670" y2="130" stroke="#9fe3bd" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
</svg>
